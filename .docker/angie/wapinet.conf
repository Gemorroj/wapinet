upstream wapinet_upstream {
    zone wapinet_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server php:9000 resolve fail_timeout=5s max_fails=5;
}

server {
    location ~ /\. {
        deny all;
    }

    charset utf-8;
    listen 80;
    client_max_body_size 50m;

    server_name localhost;
    root /var/www/wapinet/public;
    index index.php;

    add_header X-Frame-Options "DENY";

    location = /favicon.ico {
        access_log off;
        expires 30d;
    }
    location = /robots.txt {
        access_log off;
        expires 30d;
    }
    location /bundles/ {
        access_log off;
        expires 30d;
    }
    location = / {
        try_files /app/index.html =404;
    }
    # API, админка и профайлер — в Symfony
    location ~ ^/(api|admin|_profiler|_wdt)(/|$) {
        try_files $uri /index.php$is_args$args;
    }
    location /app/ {
        try_files $uri =404;
    }
    location /resources/ {
        access_log off;
        expires 30d;
    }
    location /media/cache/resolve/ {
        # превью по запросу: в PHP, без кеша
        access_log off;
        try_files $uri /index.php$is_args$args;
    }
    location /media/ {
        access_log off;
        expires 30d;
    }
    location /static/ {
        # всё отдаём вложением, чтобы html/js из обменника не исполнились в браузере
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        expires 30d;
    }

    location / {
        # остальное — SPA-шелл
        try_files $uri /app/index.html;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass wapinet_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # Xdebug на паузе не должен обрываться по таймауту
        fastcgi_read_timeout 300s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }
}
