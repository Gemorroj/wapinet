# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Known infrastructure failures get an HTTP status only: the public detail
    # stays generic (Conflict, Service Unavailable).
    exceptions:
        Doctrine\DBAL\Exception\UniqueConstraintViolationException:
            status_code: 409
        Doctrine\ORM\OptimisticLockException:
            status_code: 409
        Doctrine\DBAL\Exception\ConstraintViolationException:
            status_code: 422
        Doctrine\DBAL\Exception\ConnectionException:
            status_code: 503
        Doctrine\DBAL\Exception\RetryableException:
            status_code: 503
        Symfony\Component\Messenger\Exception\TransportException:
            status_code: 503

    http_client:
        default_options:
            headers:
                'User-Agent': 'Wapinet.ru'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        name: 'wapinet'
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
