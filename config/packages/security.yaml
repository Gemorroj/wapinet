security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User:
            algorithm: auto
            migrate_from:
                - sha512
        App\Entity\File:
            algorithm: sha512

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        wapinet_user_provider:
            id: App\Security\UserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api_login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: wapinet_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_auth_login
                username_path: username
                password_path: password
                success_handler: App\Security\ApiLoginSuccessHandler
                failure_handler: App\Security\ApiLoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
        api:
            pattern: ^/api
            stateless: true
            provider: wapinet_user_provider
            access_token:
                token_handler: App\Security\ApiTokenHandler
        admin:
            pattern: ^/admin
            provider: wapinet_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                provider: wapinet_user_provider
                login_path: admin_login
                check_path: admin_login_check
                default_target_path: admin
                enable_csrf: true
                csrf_token_id: authenticate
                csrf_parameter: _csrf_token
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: /admin/logout
            lazy: true
        main:
            pattern: ^/
            stateless: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/auth/(login|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/bbcode/preview$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/browser-info$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/whois$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/http$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/audio-tags, roles: PUBLIC_ACCESS }
        - { path: ^/api/hash$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/php-obfuscator$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/api/php-validator$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/api/(html|css)-validator$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/archiver, roles: PUBLIC_ACCESS }
        - { path: ^/api/(health|doc|config), roles: PUBLIC_ACCESS }
        - { path: ^/api/files, roles: PUBLIC_ACCESS, methods: [GET, HEAD, POST] }
        - { path: ^/api/(tags|online|home|news|gists), roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api/guestbook, roles: PUBLIC_ACCESS, methods: [GET, HEAD, POST] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        firewalls:
            admin:
                http_basic: ~
                entry_point: http_basic
            main:
                http_basic: ~
                entry_point: http_basic
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

