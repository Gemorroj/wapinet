# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    .container.dumper.inline_factories: true # performance optimization. see https://symfony.com/doc/current/performance.html#dump-the-service-container-into-a-single-file
    locale: 'ru'
    wapinet_title: 'WEB мастерская wapinet.ru'

    wapinet_paginate_maxperpage: 10
    wapinet_user_last_activity_delay: 60
    wapinet_archiver_comment: 'Wapinet.ru archiver'
    wapinet_video_screenshot_second: 5

    router.request_context.host: wapinet.ru # для определения хоста в консольном режиме

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\ApiDoc\MapQueryStringDeepObjectProcessor:
        tags:
            - { name: nelmio_api_doc.swagger.processor, priority: -10 }

    # Adds public messages of PublicErrorInterface exceptions to problem+json,
    # including in production where Symfony would render the status text.
    App\Serializer\ApiProblemNormalizer:
        decorates: serializer.normalizer.problem
        arguments: ['@.inner']

when@test:
    services:
        App\Tests\Stub\SearchEngineStub: ~

        App\Service\Search\SearchEngineInterface:
            alias: App\Tests\Stub\SearchEngineStub

        App\Tests\Stub\WhoisGatewayStub: ~

        App\Service\Api\Whois\WhoisGatewayInterface:
            alias: App\Tests\Stub\WhoisGatewayStub

        App\Tests\Stub\WhoisDnsLookupStub: ~

        App\Service\Api\Whois\WhoisDnsLookupInterface:
            alias: App\Tests\Stub\WhoisDnsLookupStub

