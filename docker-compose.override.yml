services:
    php:
        environment:
            XDEBUG_MODE: ${XDEBUG_MODE:-off}

    frontend:
        image: node:26-alpine
        working_dir: /app
        restart: unless-stopped
        volumes:
            - './frontend:/app'
            - './public:/public'
            - 'frontend_node_modules:/app/node_modules'
        environment:
            API_TARGET: http://angie
            CI: '1'
        command: sh -c '[ -x node_modules/.bin/ng ] || npm ci; npm start -- --host 0.0.0.0 --port 4200'
        ports:
            - '${FRONTEND_PORT:-4200}:4200'
        depends_on:
            - angie

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        environment:
            MP_MAX_MESSAGES: '500'
        ports:
            - '${MAILPIT_SMTP_PORT:-1025}:1025'
            - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
    frontend_node_modules:
