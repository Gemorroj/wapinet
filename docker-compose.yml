name: wapinet

services:
    mysql:
        build: ./.docker/mysql
        command: [--innodb-use-native-aio=0, --skip-mysqlx]
        restart: unless-stopped
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_DATABASE: ${MYSQL_DATABASE:-wapinet}
            MYSQL_USER: ${MYSQL_USER:-wapinet}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-passwoRt}
        volumes:
            - 'mysql_data:/var/lib/mysql'
            - '.docker/mysql/server.cnf:/etc/mysql/my.cnf'
        ports:
            - '${MYSQL_PORT:-3306}:3306'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '--silent']
            interval: 5s
            timeout: 3s
            retries: 30

    manticore:
        build: ./.docker/manticore
        restart: unless-stopped
        environment:
            CREATE_PLAIN_TABLES: '1'
        depends_on:
            mysql:
                condition: service_healthy
        ports:
            - '${MANTICORE_MYSQL_PORT:-9306}:9306' # mysql adapter
            - '${MANTICORE_HTTP_PORT:-9308}:9308' # http json api
        ulimits:
            nproc: 65535
            nofile:
                soft: 65535
                hard: 65535
            memlock:
                soft: -1
                hard: -1
        volumes:
            - './.docker/manticore/manticore.conf:/etc/manticoresearch/manticore.conf'
            - 'manticore_data:/var/lib/manticore'

    php:
        build: ./.docker/php
        restart: unless-stopped
        volumes:
            - '.:/var/www/app'
            - './.docker/php/php.ini:/usr/local/etc/php/php.ini'
            - './.docker/php/php-fpm.conf:/usr/local/etc/php-fpm.conf'
            - './.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            mysql:
                condition: service_healthy
            manticore:
                condition: service_started

    messenger:
        build: ./.docker/php
        restart: unless-stopped
        volumes:
            - '.:/var/www/app'
        command: ['php', 'bin/console', 'messenger:consume', 'async', '--time-limit=3600', '--memory-limit=256M']
        depends_on:
            mysql:
                condition: service_healthy

    angie:
        build: ./.docker/angie
        restart: unless-stopped
        volumes:
            - '.:/var/www/app'
            - './.docker/angie/app.conf:/etc/angie/http.d/default.conf'
        ports:
            - '${HTTP_PORT:-80}:80'
        depends_on:
            - php

volumes:
    mysql_data:
    manticore_data:
