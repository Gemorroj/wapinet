<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <title>Wapinet</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/resources/xbbcode/resources/style.css" data-beasties-skip />
        <script>
            (() => {
                try {
                    const saved = localStorage.getItem('tuiDark');
                    const dark = null === saved ? matchMedia('(prefers-color-scheme: dark)').matches : 'true' === saved;

                    document.documentElement.setAttribute('tuiTheme', dark ? 'dark' : 'light');
                } catch {
                    document.documentElement.setAttribute('tuiTheme', 'light');
                }
            })();
        </script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
